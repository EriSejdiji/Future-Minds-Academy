<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        img {
            border-radius: 50%;
            width: 200px;
            filter: blur(5px);
            transition: transform .8s ease-in-out;
        }
        img:hover {
            transform:rotate(720deg);
            filter: blur(0px);
            
        }
    </style>
</head>
<body>
    <img src="image2.jfif" alt="image">
    
</body>
</html>
