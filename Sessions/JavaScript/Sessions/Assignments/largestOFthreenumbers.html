    <script>
        let a = parseInt(prompt('shkruani nr e pare:'));
         let b = parseInt(prompt('shkruani nr e dyte:'));
          let c = parseInt(prompt('shkruani nr e trete:'));

          if (a > b && a > c) {
            console.log(console.log(`${a} eshte nr me i madh`))
          }

           else if (b > a && b > c) {
            console.log(console.log(`${b} eshte nr me i madh`))
          }

           else  {
            console.log(console.log(`${c} eshte nr me i madh`))
          }

    </script>
