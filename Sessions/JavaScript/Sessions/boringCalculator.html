<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let firstNumber = parseInt(prompt('Shkruani numrin e pare'));
        let operator = prompt('Shkruani operatorin');
        let secondNumber = parseInt(prompt('Shkruani numrin e dyte'));
        
        let res; 

        if (operator == '+') {
            res = firstNumber + secondNumber;
            console.log(res)
        }
        else if (operator == '-') {
            res = firstNumber - secondNumber;
            console.log(res)
        }
        else {
            console.log('keni shkruar gabim operatorin')
        }
        


    </script>

</body>

</html>
