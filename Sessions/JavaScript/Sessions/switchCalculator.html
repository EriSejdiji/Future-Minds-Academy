<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
     let firstNumber = parseInt(prompt('Shkruani numrin e pare'));
        let operator = prompt('Shkruani operatorin');
        let secondNumber = parseInt(prompt('Shkruani numrin e dyte'));
    
        let result; 
        switch(operator){
            case '+':
            result = firstNumber + secondNumber;
            console.log(result)
            break;
            case '-':
                result= firstNumber - secondNumber;
                console.log(result)
                break;
                case '*':
                result= firstNumber * secondNumber;
                console.log(result)
                break;
                case '/':
                result= firstNumber / secondNumber;
                console.log(result)
                break;
                default:
                    console.log('you have entered an invalid operation!')

        }

</script>
</body>
</html>
